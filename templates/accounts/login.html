{% extends 'base.html' %}
{% block title %}ورود / ثبت‌نام{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon-svg">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3h12l4 6-10 12L2 9z"/>
                    <path d="M11 3 8 9l4 12 4-12-3-6"/>
                    <path d="M2 9h20"/>
                </svg>
            </span>
            <h1 class="auth-title">ورود به عطر رایحا</h1>
            <p class="auth-subtitle">شماره موبایل خود را وارد کنید</p>
        </div>
        <form method="POST" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_phone_number">{{ form.phone_number.label }}</label>
                {{ form.phone_number }}
                {% if form.phone_number.errors %}
                <span class="form-error">{{ form.phone_number.errors.0 }}</span>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary btn-block">دریافت کد تأیید</button>
        </form>
    </div>
</div>
{% endblock %}
