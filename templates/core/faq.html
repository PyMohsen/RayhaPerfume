{% extends 'base.html' %}
{% block title %}سوالات متداول{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header"><h1 class="page-title">سوالات متداول</h1></div>
    {% if faqs %}
    <div class="faq-list">
        {% for faq in faqs %}
        <div class="faq-item">
            <button class="faq-question" onclick="this.parentElement.classList.toggle('open')">
                <span>{{ faq.question }}</span>
                <span class="faq-arrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </span>
            </button>
            <div class="faq-answer">{{ faq.answer|linebreaks }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
